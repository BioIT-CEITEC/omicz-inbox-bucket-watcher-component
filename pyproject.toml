[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "s3-watcher"
version = "0.1.0"
description = "S3 Bucket Watcher Service - validates and transfers S3 data using checksum manifests"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiobotocore>=3.7.0",
    "click>=8.4.0",
    "prometheus-client>=0.25.0",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
s3-watcher = "src.cli:main"

[dependency-groups]
dev = [
    "moto>=5.2.1",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
